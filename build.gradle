plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = mod_version
group = 'invtweaks'
base { archivesName = 'inventory-tweaks-neoforge' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
sourceSets.main { java.srcDirs = ['src/neoforge/java']; resources.srcDirs = ['src/neoforge/resources'] }
neoForge {
 version = '21.1.265'
 runs { client { client() }; server { server(); programArgument '--nogui' } }
 mods { inventorytweaks { sourceSet sourceSets.main } }
}
tasks.named('processResources', ProcessResources) { filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version } }
tasks.named('jar') { from('LICENSE.md'); from('NOTICE.md') }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
